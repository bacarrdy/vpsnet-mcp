name: vpsnet-remote
type: remote
dynamic:
  tools: true
meta:
  category: devops
  tags:
    - devops
    - hosting
    - networking
    - remote
about:
  title: VPSnet
  description: Manage VPSnet servers, applications, DNS, private networks and Functions with customer-selected services and OAuth permissions.
  icon: https://raw.githubusercontent.com/bacarrdy/vpsnet-mcp/main/plugin/assets/icon.png
remote:
  transport_type: streamable-http
  url: https://mcp.vpsnet.com/mcp
oauth:
  - provider: vpsnet-remote
    secret: vpsnet-remote.personal_access_token
    env: VPSNET_REMOTE_PERSONAL_ACCESS_TOKEN
