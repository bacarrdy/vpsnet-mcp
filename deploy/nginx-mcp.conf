# Include inside the TLS virtual host for mcp.vpsnet.com.
# Provision its certificate and DNS through the existing VPSnet deployment system.
server_tokens off;

# Store the publisher portal's exact plain-text token outside the repository.
location = /.well-known/openai-apps-challenge {
    alias /var/www/vpsnet-mcp-acme/.well-known/openai-apps-challenge;
    default_type text/plain;
    add_header Cache-Control "no-store" always;
}

location = /mcp {
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host mcp.vpsnet.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Authorization $http_authorization;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 70s;
}
location = /.well-known/oauth-protected-resource/mcp {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host mcp.vpsnet.com;
}
location = /.well-known/oauth-protected-resource {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host mcp.vpsnet.com;
}
